[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl"
version = "0.1.0"
description = "Reinforcement learning algorithms implemented from scratch, with lessons and experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "gymnasium>=1.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.0", "tensorboard>=2.16"]
box2d = ["gymnasium[box2d]>=1.0"]
mujoco = ["gymnasium[mujoco]>=1.0"]

[tool.setuptools.packages.find]
include = ["rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
