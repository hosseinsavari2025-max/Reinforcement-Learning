# DQN on CartPole-v1 — solves (return ~500) in roughly 50k steps on CPU.
algo: dqn
env_id: CartPole-v1
seed: 42
total_steps: 60000
learning_starts: 1000
train_freq: 1
batch_size: 64
buffer_size: 50000
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 20000
eval_episodes: 10

agent:
  gamma: 0.99
  lr: 0.0005
  hidden_sizes: [128, 128]
  target_update_interval: 500
  double_dqn: true
  max_grad_norm: 10.0
